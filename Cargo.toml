[package]
name = "bcml"
authors = ["Caleb Smith"]
version = "3.10.8"
edition = "2021"
readme = "docs/README.md"

[lib]
name = "bcml"
crate-type = ["cdylib"]

[dependencies]
msyt = { git = "https://github.com/NiceneNerd/msyt", rev = "12e4d95fb6480f445284f37706db7bfa8351dc06" }
botw-utils = "0.3.1"
rstb = "1.0.0"
roead = { git = "https://github.com/cobra838/roead", rev = "98565e45a84d4fdd252913ca0681b703192eda47", features = ["yaml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
anyhow = "1"
cow-utils = "0.1.3"
dircpy = "0.3.20"
dirs2 = "3.0.1"
fs-err = "3"
glob = "0.3.4"
indexmap = { version = "1.9.1", features = ["serde", "rayon"] }
join_str = "0.1.0"
once_cell = "1.21.4"
path-slash = "0.2"
parking_lot = "0.12.5"
pyo3 = { version = "0.29", features = ["extension-module", "anyhow"] }
rustc-hash = "2"
smartstring = "1.0.1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
junction = { git = "https://github.com/NiceneNerd/junction", rev = "84e0dbd793645acf2702de283f78e8f6e0043ea5" }
mslnk = "0.1.8"
remove_dir_all = "0.8"

[profile.release]
lto = "fat"
codegen-units = 1