name: Build BCML wheels

on:
  workflow_dispatch:

concurrency:
  group: bcml-package-index
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build_wheels:
    name: Build wheel (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.9", label: Windows x64 CPython 3.9, artifact: wheel-windows-cp39 }
          - { os: windows-latest, python: "3.10", label: Windows x64 CPython 3.10, artifact: wheel-windows-cp310 }
          - { os: windows-latest, python: "3.11", label: Windows x64 CPython 3.11, artifact: wheel-windows-cp311 }
          - { os: windows-latest, python: "3.12", label: Windows x64 CPython 3.12, artifact: wheel-windows-cp312 }
          - { os: windows-latest, python: "3.13", label: Windows x64 CPython 3.13, artifact: wheel-windows-cp313 }
          - { os: windows-latest, python: "3.14", label: Windows x64 CPython 3.14, artifact: wheel-windows-cp314 }
          - { os: ubuntu-latest, python: "3.9", label: Linux x64 CPython 3.9, artifact: wheel-linux-cp39 }
          - { os: ubuntu-latest, python: "3.10", label: Linux x64 CPython 3.10, artifact: wheel-linux-cp310 }
          - { os: ubuntu-latest, python: "3.11", label: Linux x64 CPython 3.11, artifact: wheel-linux-cp311 }
          - { os: ubuntu-latest, python: "3.12", label: Linux x64 CPython 3.12, artifact: wheel-linux-cp312 }
          - { os: ubuntu-latest, python: "3.13", label: Linux x64 CPython 3.13, artifact: wheel-linux-cp313 }
          - { os: ubuntu-latest, python: "3.14", label: Linux x64 CPython 3.14, artifact: wheel-linux-cp314 }
          - { os: macos-14, python: "3.9", label: macOS arm64 CPython 3.9, artifact: wheel-macos-cp39 }
          - { os: macos-14, python: "3.10", label: macOS arm64 CPython 3.10, artifact: wheel-macos-cp310 }
          - { os: macos-14, python: "3.11", label: macOS arm64 CPython 3.11, artifact: wheel-macos-cp311 }
          - { os: macos-14, python: "3.12", label: macOS arm64 CPython 3.12, artifact: wheel-macos-cp312 }
          - { os: macos-14, python: "3.13", label: macOS arm64 CPython 3.13, artifact: wheel-macos-cp313 }
          - { os: macos-14, python: "3.14", label: macOS arm64 CPython 3.14, artifact: wheel-macos-cp314 }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install build tools
        run: |
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements-build.txt

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup run nightly rustc --version
          rustup run nightly cargo --version

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: bcml/assets/package-lock.json

      - name: Build frontend assets
        run: |
          npm --prefix bcml/assets install
          npm --prefix bcml/assets run build

      - name: Build docs
        run: python -m mkdocs build -d ./bcml/assets/help

      - name: Build wheel
        run: rustup run nightly python -m maturin build --release --interpreter python

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/wheels/*.whl
          if-no-files-found: error

  publish:
    name: Publish package index
    needs: build_wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Create package index
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python - <<'PY'
          from hashlib import sha256
          from html import escape
          from pathlib import Path
          import os
          import re
          import shutil

          release_dir = Path("release")
          site = Path("package-index")
          wheel_dir = site / "wheels"
          project_dir = site / "simple" / "bcml"
          wheel_dir.mkdir(parents=True)
          project_dir.mkdir(parents=True)
          wheels = sorted(release_dir.glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheel artifacts were downloaded")

          page_url = os.environ["PAGES_URL"]
          links = []
          requirements = []
          for wheel in wheels:
              name = wheel.name
              match = re.search(r"-cp(\d+)-cp\d+-(.+)\.whl$", name)
              if not match:
                  raise SystemExit(f"Unsupported wheel filename: {name}")
              tag, platform = match.groups()
              python_version = f"{tag[0]}.{tag[1:]}"
              if platform.endswith("win_amd64"):
                  system, machine = "Windows", "AMD64"
              elif "macosx" in platform and platform.endswith("arm64"):
                  system, machine = "Darwin", "arm64"
              elif "linux" in platform and platform.endswith("x86_64"):
                  system, machine = "Linux", "x86_64"
              else:
                  raise SystemExit(f"Unsupported wheel platform: {platform}")

              destination = wheel_dir / name
              shutil.copy2(wheel, destination)
              digest = sha256(destination.read_bytes()).hexdigest()
              links.append(f'<a href="../../wheels/{escape(name)}#sha256={digest}">{escape(name)}</a>')
              requirements.append(
                  f'bcml @ {page_url}/wheels/{name} ; python_version == "{python_version}" '
                  f'and platform_system == "{system}" and platform_machine == "{machine}"'
              )

          (site / "simple").mkdir(exist_ok=True)
          (site / "simple" / "index.html").write_text(
              "<!doctype html><html><body><a href=\"bcml/\">bcml</a></body></html>\n",
              encoding="utf-8",
          )
          (project_dir / "index.html").write_text(
              "<!doctype html><html><body>" + "\n".join(links) + "</body></html>\n",
              encoding="utf-8",
          )
          (site / "latest.txt").write_text(
              "-r https://cobra838.github.io/oead/latest.txt\n" + "\n".join(requirements) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload package index
        uses: actions/upload-pages-artifact@v5
        with:
          path: package-index

      - name: Deploy package index
        uses: actions/deploy-pages@v5
